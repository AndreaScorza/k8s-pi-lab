[pi]
# Reached over the WireGuard tunnel (wg0), not the LAN IP — this lets the
# playbook run from a machine that isn't on the Pi's local network.
raspberrypi ansible_host=10.6.0.1 ansible_user=pi

[pi:vars]
# Whether k3s should be running. false pauses the cluster without deleting
# anything (state, volumes, images stay on disk); flip back to true and re-run
# the playbook to resume. Paused on 2026-10-15 to free the Pi's resources.
k3s_enabled=false
