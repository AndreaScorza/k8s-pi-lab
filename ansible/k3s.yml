- name: Bootstrap k3s on the Pi
  hosts: pi
  become: true

  tasks:
    - name: Install k3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure /etc/rancher/k3s exists
      file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Disable the bundled Traefik ingress
      # Nothing in this cluster uses Traefik as an ingress (no Ingress/IngressRoute
      # resources), but its LoadBalancer service DNATs all host traffic on ports
      # 80/443 to itself, breaking Caddy which also runs on this box.
      copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          disable:
            - traefik
        owner: root
        group: root
        mode: "0644"
      notify: Restart k3s

    - name: Start k3s and enable it at boot
      systemd:
        name: k3s
        state: started
        enabled: true
      when: k3s_enabled | bool

    - name: Stop k3s and disable it at boot
      systemd:
        name: k3s
        state: stopped
        enabled: false
      when: not (k3s_enabled | bool)
      register: k3s_stopped

    - name: Kill pod containers left running by the stopped k3s
      # Stopping the k3s unit deliberately leaves pod containers running (so
      # k3s upgrades don't restart workloads); killall stops them. It deletes
      # nothing on disk.
      command: /usr/local/bin/k3s-killall.sh
      when: k3s_stopped is changed

  handlers:
    - name: Restart k3s
      systemd:
        name: k3s
        state: restarted
      when: k3s_enabled | bool
