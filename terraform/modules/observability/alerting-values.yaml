alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "telegram"
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 15m
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "telegram"
          matchers:
            - severity = "critical"
          repeat_interval: 5m
    receivers:
      - name: "null"
      - name: "telegram"
        telegram_configs:
          - parse_mode: ""
            message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

additionalPrometheusRulesMap:
  pi-alerts:
    groups:
      - name: pi-temperature
        rules:
          - alert: PiHighTemperature
            expr: node_hwmon_temp_celsius{sensor="temp0"} > 70
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "⚠️ Pi temperature is {{ $value }}°C - getting warm!"

          - alert: PiCriticalTemperature
            expr: node_hwmon_temp_celsius{sensor="temp0"} > 80
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "🔴 Pi temperature is {{ $value }}°C - CPU throttling!"