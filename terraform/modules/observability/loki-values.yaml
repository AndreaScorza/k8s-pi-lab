deploymentMode: SingleBinary

singleBinary:
  replicas: 1

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# Disable caches - not needed for single node, Pi doesn't have RAM for it
chunksCache:
  enabled: false

resultsCache:
  enabled: false

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  limits_config:
    retention_period: 72h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  ingester:
    chunk_idle_period: 30m
    chunk_target_size: 1536000
    max_chunk_age: 2h
    wal:
      flush_on_shutdown: true
      checkpoint_duration: 5m

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h